# AirPrice configuration template.
# Copy this file to config/config.ini and fill in only the settings you intend to use.
# config.ini must never be committed to version control (it is already listed in .gitignore).

[GSHEETS]
# Optional. Leave these fields blank to use only local Excel output in DADOS_BRUTOS/.
# credentials_file: path to the Google Cloud Service Account JSON file.
# spreadsheet_id: spreadsheet ID (the portion of the URL between /d/ and /edit).
# worksheet_name: worksheet where rows will be appended (created automatically if absent).
credentials_file =
spreadsheet_id =
worksheet_name = Data

[ANTIDETECT]
# humanize: enables human-like waits (interruptible_sleep) between browser actions.
# save_html: saves raw page HTML in LOGS/ as .html.gz (removed after MD5 verification).
# screenshot: saves a screenshot in LOGS/ when an attempt fails or returns no data.
humanize = True
save_html = False
screenshot = False

[PROXY]
# enabled: enables proxy use during collection runs.
# list: comma-separated proxy list in host:port format.
enabled = False
list =
